# Every pull request and every push to main. Two kinds of job:
#   check: install, typecheck, lint, unit tests, build and bench. The bench fails on sim and
#   worldgen budgets.
#   e2e (n of 3): the end-to-end suite (Chromium) in three parallel shards.
# A pull request is green when check and all three e2e jobs pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Pinned: ubuntu-latest began moving to 26.04, where Playwright's --with-deps cannot find its font packages (fonts-unifont, fonts-freefont-ttf) and the Install Chromium step fails.
    runs-on: ubuntu-24.04
    # The unit tests run 8 to 13 minutes and the bench 2 to 3, depending on the runner.
    timeout-minutes: 45
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bench
        run: npm run bench

      - name: Upload bench report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: bench-report
          path: bench-report.json
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: e2e (${{ matrix.shard }} of 3)
    runs-on: ubuntu-24.04
    # R3 and V4: one serial run of the suite took 50 minutes on a fast runner and 90 to 100 on a
    # slow one (Measure this laptop alone 11 to 27), which cut runs off and pushed slow shots past
    # their timeouts. Three shards keep each job well inside the limit on any runner.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End to end
        run: npm run e2e -- --shard=${{ matrix.shard }}/3

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/client/playwright-report
            apps/client/test-results
          retention-days: 14
