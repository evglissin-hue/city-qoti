# Every pull request and every push to main: install, typecheck, lint, unit tests, build,
# end-to-end (Chromium) and bench. The bench fails on sim and worldgen budgets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End to end
        run: npm run e2e

      - name: Bench
        run: npm run bench

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            apps/client/playwright-report
            apps/client/test-results
          retention-days: 14

      - name: Upload bench report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: bench-report
          path: bench-report.json
          if-no-files-found: ignore
          retention-days: 14
