<style>
/* Layout: a full-bleed 3D stage with the game's own paper panels floating over it. */
:root {
  --paper: #F7F0E1;
  --paper-shade: #E9DEC6;
  --ink: #3B3229;
  --ink-soft: #6B5E50;
  --hearth: #C7604A;
  --ledger: #3E6E5A;
  --stage: #C9D6D2;
  --hud-bg: rgba(43, 36, 30, 0.82);
  --hud-ink: #F3EBDD;
  --display: 'Alegreya', Georgia, 'Times New Roman', serif;
  --ui: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--stage); color: var(--ink); font-family: var(--ui); font-size: 15px; overflow: hidden; }
#stage { position: fixed; inset: 0; }
#view { display: block; width: 100%; height: 100%; touch-action: none; }
#today { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: var(--stage); }
.paper {
  background: var(--paper); border: 1.5px solid var(--ink); border-radius: 10px;
  box-shadow: 0 2px 0 var(--paper-shade), 0 10px 26px rgba(40, 30, 20, 0.22);
}
.brand {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  padding: 10px 14px 9px; max-width: min(340px, calc(100vw - 32px));
}
.brand h1 { font-family: var(--display); font-weight: 700; font-size: 21px; margin: 0; line-height: 1.1; text-wrap: balance; }
.brand p { margin: 3px 0 0; color: var(--ink-soft); font-size: 13.5px; line-height: 1.3; }
.note {
  position: fixed; top: calc(56px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  width: 318px; padding: 14px 16px 12px; display: grid; gap: 8px; max-height: calc(100vh - 220px); overflow-y: auto;
}
.note .eyebrow { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; display: flex; gap: 8px; align-items: center; }
.note .pick { background: var(--ledger); color: var(--paper); border-radius: 99px; padding: 1px 8px; letter-spacing: 0.04em; }
.note h2 { font-family: var(--display); font-size: 23px; margin: 0; line-height: 1.1; text-wrap: balance; }
.note .tag { margin: 0; font-style: italic; color: var(--ink-soft); }
.note ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; line-height: 1.35; }
.note dl { margin: 2px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 14px; }
.note dt { font-weight: 700; color: var(--ink-soft); }
.note dd { margin: 0; }
.note .era { border-top: 1px dashed var(--ink-soft); padding-top: 8px; font-size: 14px; line-height: 1.35; }
.note .era b { font-family: var(--display); }
#noteToggle {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  font: 700 14px var(--ui); color: var(--ink); padding: 7px 12px; cursor: pointer; z-index: 2;
}
.note.collapsed { display: none; }
.clean .paper, .clean .hud, .clean #noteToggle { display: none !important; }
.dock {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 12px; align-items: flex-end; padding: 9px 12px 10px;
  width: max-content; max-width: calc(100vw - 32px);
}
.group { display: grid; gap: 4px; flex: none; }
.group .label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
.seg { display: flex; border: 1.5px solid var(--ink); border-radius: 8px; overflow: hidden; }
.seg button {
  font: 500 14px/1 var(--ui); color: var(--ink); background: var(--paper); border: 0; border-left: 1px solid var(--paper-shade);
  padding: 7px 9px; cursor: pointer; white-space: nowrap;
}
.seg button:first-child { border-left: 0; }
.seg button:hover { background: var(--paper-shade); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg button:focus-visible, .check input:focus-visible, #noteToggle:focus-visible, .hud button:focus-visible { outline: 2px solid var(--hearth); outline-offset: 2px; }
.check { display: flex; align-items: center; gap: 6px; font-size: 14px; padding-bottom: 7px; white-space: nowrap; cursor: pointer; }
.check input { accent-color: var(--ledger); width: 16px; height: 16px; margin: 0; }
.hud {
  position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(118px + env(safe-area-inset-top, 0px));
  background: var(--hud-bg); color: var(--hud-ink); border-radius: 8px; padding: 8px 10px; font: 12px/1.45 var(--mono);
  font-variant-numeric: tabular-nums; min-width: 210px;
}
.hud .row { display: flex; justify-content: space-between; gap: 12px; }
.hud .q { display: flex; gap: 4px; margin-top: 6px; }
.hud button { font: 12px var(--mono); background: transparent; color: var(--hud-ink); border: 1px solid rgba(243,235,221,0.4); border-radius: 5px; padding: 2px 7px; cursor: pointer; }
.hud button[aria-pressed="true"] { background: var(--hud-ink); color: #2B241E; }
.hud .cmp { display: block; margin-top: 6px; color: var(--hud-ink); font: 11.5px var(--ui); }
.hud .cmp:focus-visible { outline: 2px solid var(--hearth); outline-offset: 2px; }
.loading {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 12px 18px;
  font-family: var(--display); font-size: 18px;
}
.caption {
  position: fixed; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top, 0px));
  padding: 6px 12px; font-size: 14px; max-width: calc(100vw - 32px);
}
@media (max-width: 1180px) {
  .note { width: 280px; }
}
@media (max-width: 760px) {
  body { font-size: 14px; }
  .brand { padding: 8px 10px; }
  .brand h1 { font-size: 18px; }
  .brand p { display: none; }
  .note { left: max(16px, env(safe-area-inset-left, 0px)); width: auto; max-height: 55vh; }
  .dock { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); transform: none; width: auto; max-width: none; flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; }
  .hud { top: calc(64px + env(safe-area-inset-top, 0px)); bottom: auto; min-width: 0; font-size: 11px; }
  .hud .q { display: none; }
  .caption { top: auto; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';

// ---------------------------------------------------------------- utilities
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hashN(...ns) { let h = 2166136261 >>> 0; for (const n of ns) { h ^= (Math.round(n * 1000) | 0) >>> 0; h = Math.imul(h, 16777619) >>> 0; h ^= h >>> 13; } return h >>> 0; }
function rngOf(...ns) {
  const r = mulberry32(hashN(...ns));
  return {
    f: r, range: (a, b) => a + (b - a) * r(), int: (a, b) => a + Math.floor(r() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(r() * arr.length) % arr.length], chance: (p) => r() < p,
    weighted: (pairs) => { let s = 0; for (const [, w] of pairs) s += w; let x = r() * s; for (const [v, w] of pairs) { x -= w; if (x <= 0) return v; } return pairs[pairs.length - 1][0]; },
  };
}
function h2(x, y) { return (hashN(x, y, 77) & 0xffff) / 65535; }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = h2(xi, yi), b = h2(xi + 1, yi), c = h2(xi, yi + 1), d = h2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o = 4) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); f *= 2.02; a *= 0.5; } return s; }
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const lin = (hex) => { const c = new THREE.Color(hex); return [c.r, c.g, c.b]; };
const mul = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
const mix3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

// Valley terrain: flat town floor, hills beyond, a flat strip along the river.
const CANAL_N = 27, CANAL_S = 30.5;
function terrainH(x, z) {
  const r = Math.hypot(x * 0.85, z);
  if (r < 60) return 0;
  const t = Math.min(1, (r - 60) / 55);
  const valley = smooth(4, 20, Math.abs(z - 28.7));
  return Math.max(0, t * t * (fbm(x * 0.018 + 3.1, z * 0.018 - 7.3) * 16 - 2.5)) * valley;
}

// ---------------------------------------------------------------- materials ids
const M = { plain: 0, plaster: 1, brick: 2, stone: 3, timber: 4, tile: 5, slate: 6, thatch: 7, cobble: 8, glass: 9, grass: 10, dirt: 11, water: 12, leaf: 13, zinc: 14, awning: 15, field: 16, flags: 17, flowers: 18 };
const EMI = { none: 0, window: 1, lamp: 2 };

// ---------------------------------------------------------------- geometry builder
function growArr(a, n) { const b = new a.constructor(n); b.set(a); return b; }
// One vertex store. A GB writes into one store, or (when chunked) into the store of the chunk it is building in.
class Store {
  constructor(cap = 4096) {
    this.cap = cap; this.P = new Float32Array(cap * 3); this.N = new Int8Array(cap * 3); this.C = new Uint8Array(cap * 3);
    this.Mt = new Uint8Array(cap); this.Em = new Uint8Array(cap); this.I = new Uint32Array(cap * 2); this.nv = 0; this.ni = 0;
  }
  ensure(nv, ni) {
    if (this.nv + nv > this.cap) {
      let c = this.cap; while (this.nv + nv > c) c *= 2;
      this.P = growArr(this.P, c * 3); this.N = growArr(this.N, c * 3); this.C = growArr(this.C, c * 3);
      this.Mt = growArr(this.Mt, c); this.Em = growArr(this.Em, c); this.cap = c;
    }
    if (this.ni + ni > this.I.length) { let c = this.I.length; while (this.ni + ni > c) c *= 2; this.I = growArr(this.I, c); }
  }
  geometry() {
    const g = new THREE.BufferGeometry(); const nv = this.nv;
    g.setAttribute('position', new THREE.BufferAttribute(this.P.slice(0, nv * 3), 3));
    g.setAttribute('normal', new THREE.BufferAttribute(this.N.slice(0, nv * 3), 3, true));
    g.setAttribute('color', new THREE.BufferAttribute(this.C.slice(0, nv * 3), 3, true));
    g.setAttribute('aMat', new THREE.BufferAttribute(this.Mt.slice(0, nv), 1));
    g.setAttribute('aEmi', new THREE.BufferAttribute(this.Em.slice(0, nv), 1));
    g.setIndex(new THREE.BufferAttribute(this.I.slice(0, this.ni), 1));
    g.computeBoundingSphere(); return g;
  }
  get tris() { return this.ni / 3; }
}
// Face color jitter keyed by position, so the near and far versions of a building get the same paint.
function jhash(x, y, z, m) { let h = (Math.imul(x | 0, 73856093) ^ Math.imul(y | 0, 19349663) ^ Math.imul(z | 0, 83492791) ^ Math.imul(m | 0, 668265263)) >>> 0; h = Math.imul(h ^ (h >>> 13), 0x5bd1e995) >>> 0; h ^= h >>> 15; return (h >>> 0) / 4294967296; }
class GB {
  constructor(cap = 8192, chunk = 0) {
    this.chunk = chunk; this.stores = new Map(); this.base = new Store(cap); this.S = this.base; this.water = null; this.foot = null;
    this.worldMode = false; this.frame(0, 0, 0, 0); this.jit = 0; this.ao = 0; this.gy = 0;
  }
  frame(x, y, z, rot) {
    this.ox = x; this.oy = y; this.oz = z; this.c = Math.cos(rot); this.s = Math.sin(rot);
    if (this.chunk) { this.worldMode = x === 0 && z === 0 && rot === 0; if (!this.worldMode) this.S = this.storeAt(x, z); }
  }
  storeAt(x, z) { const cs = this.chunk; const k = (Math.floor(x / cs) + 500) * 1000 + Math.floor(z / cs) + 500; let st = this.stores.get(k); if (!st) { st = new Store(2048); this.stores.set(k, st); } return st; }
  world(p) { return [this.ox + p[0] * this.c + p[2] * this.s, this.oy + p[1], this.oz - p[0] * this.s + p[2] * this.c]; }
  poly(pts, col, mat = 0, emi = 0, inside = null) {
    const n = pts.length; if (n < 3) return;
    const W = pts.map((p) => this.world(p));
    let nx = 0, ny = 0, nz = 0;
    for (let i = 0; i < n; i++) { const a = W[i], b = W[(i + 1) % n]; nx += (a[1] - b[1]) * (a[2] + b[2]); ny += (a[2] - b[2]) * (a[0] + b[0]); nz += (a[0] - b[0]) * (a[1] + b[1]); }
    const L = Math.hypot(nx, ny, nz); if (L < 1e-9) return; nx /= L; ny /= L; nz /= L;
    let flip = false, cx = 0, cz = 0;
    for (const w of W) { cx += w[0]; cz += w[2]; }
    cx /= n; cz /= n;
    if (inside) {
      const I = this.world(inside); let cy = 0; for (const w of W) cy += w[1]; cy /= n;
      if ((cx - I[0]) * nx + (cy - I[1]) * ny + (cz - I[2]) * nz < 0) { flip = true; nx = -nx; ny = -ny; nz = -nz; }
    }
    let S = this.S;
    if (mat === M.water && this.water) S = this.water.base;
    else if (this.chunk && this.worldMode) S = this.storeAt(cx, cz);
    S.ensure(n, (n - 2) * 3);
    const k = this.jit ? 1 + this.jit * (jhash(Math.round(W[0][0] * 40), Math.round(W[0][1] * 40), Math.round(W[0][2] * 40), mat) * 2 - 1) : 1;
    const base = S.nv;
    for (let i = 0; i < n; i++) {
      const w = W[i]; let f = k;
      if (this.ao) { const h = w[1] - this.gy; f *= 1 - this.ao * (1 - Math.min(1, Math.max(0, h / 0.85))); }
      const v = S.nv++;
      S.P[v * 3] = w[0]; S.P[v * 3 + 1] = w[1]; S.P[v * 3 + 2] = w[2];
      S.N[v * 3] = Math.round(nx * 127); S.N[v * 3 + 1] = Math.round(ny * 127); S.N[v * 3 + 2] = Math.round(nz * 127);
      S.C[v * 3] = Math.min(255, Math.round(col[0] * f * 255)); S.C[v * 3 + 1] = Math.min(255, Math.round(col[1] * f * 255)); S.C[v * 3 + 2] = Math.min(255, Math.round(col[2] * f * 255));
      S.Mt[v] = mat; S.Em[v] = emi;
    }
    for (let i = 1; i < n - 1; i++) {
      const j = S.ni; S.ni += 3;
      S.I[j] = base; if (flip) { S.I[j + 1] = base + i + 1; S.I[j + 2] = base + i; } else { S.I[j + 1] = base + i; S.I[j + 2] = base + i + 1; }
    }
  }
  // A flat strip from (u1, v1) to (u2, v2) on a facade: the far version of a beam.
  fline(F, u1, v1, u2, v2, w, o, col, mat = 0) {
    const du = u2 - u1, dv = v2 - v1, L = Math.hypot(du, dv); if (L < 1e-6) return;
    const pu = (-dv / L) * w / 2, pv = (du / L) * w / 2;
    const q = (u, v) => [F.ox + F.ux * u + F.nx * o, v, F.oz + F.uz * u + F.nz * o];
    this.poly([q(u1 - pu, v1 - pv), q(u2 - pu, v2 - pv), q(u2 + pu, v2 + pv), q(u1 + pu, v1 + pv)], col, mat, 0, [F.ox - F.nx, (v1 + v2) / 2, F.oz - F.nz]);
  }
  // Axis-aligned box in the current frame. skip: f front(+z) k back(-z) r(+x) l(-x) t top; bottoms are never drawn.
  box(x0, y0, z0, x1, y1, z1, col, mat = 0, emi = 0, skip = '') {
    const c = [(x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2];
    if (!skip.includes('f')) this.poly([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], col, mat, emi, c);
    if (!skip.includes('k')) this.poly([[x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0]], col, mat, emi, c);
    if (!skip.includes('r')) this.poly([[x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1]], col, mat, emi, c);
    if (!skip.includes('l')) this.poly([[x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0]], col, mat, emi, c);
    if (!skip.includes('t')) this.poly([[x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [x0, y1, z0]], col, mat, emi, c);
  }
  // Box in a facade frame F: u along the wall, v up, o outward from the wall plane.

    if (look.detail >= 2) g.beam([-ov, ye - 0.03, ov], [w + ov, ye - 0.03, ov], 0.05, 0.06, edge, mat);
    if (st.chimneys) addChimney(g, w * 0.3, -d * 0.55, H, R + 0.3, st, look, smokeOn);

  } else if (st.roof === 'mansard') {

    if (w - 2 * m > 0.2) g.poly([t[0], t[1], [w / 2, R, -d / 2]], col, M.zinc, 0, [w / 2, top - 1, -d / 2]);
    g.poly([t[1], t[2], [w / 2, R, -d / 2]], col, M.zinc, 0, [w / 2, top - 1, -d / 2]);
    g.poly([t[2], t[3], [w / 2, R, -d / 2]], col, M.zinc, 0, [w / 2, top - 1, -d / 2]);
    g.poly([t[3], t[0], [w / 2, R, -d / 2]], col, M.zinc, 0, [w / 2, top - 1, -d / 2]);
    if (look.detail >= 2) g.box(-0.07, H - 0.02, -d - 0.07, w + 0.07, H + 0.05, 0.07, st.trim, M.stone);
    const n = Math.max(1, Math.round(w / 0.85));

      g.poly([[u - 0.12, H + 0.14, -0.035], [u + 0.12, H + 0.14, -0.035], [u + 0.12, H + 0.44, -0.035], [u - 0.12, H + 0.44, -0.035]], st.glass, M.glass, lot && lot.lit && st.r.chance(0.5) ? EMI.window : 0, [u, H, -1]);
      g.cyl(u, H + 0.5, -0.21, 0.19, 0.0, H + 0.64, 6, col, M.zinc, 0, false, Math.PI / 6);
    }
    if (st.chimneys) addChimney(g, w * 0.5, -d / 2, top - 0.2, R + 0.35, st, look, smokeOn);
  } else if (st.roof === 'flat') {

    const ph = 0.17, pt = 0.07, pc = st.wallCol;
    g.box(0, H, -pt, w, H + ph, 0, pc, M.plaster); g.box(0, H, -d, w, H + ph, -d + pt, pc, M.plaster);

    const plantRoll = st.r.chance(0.5), ventRoll = st.r.chance(0.5);

// ---------------------------------------------------------------- buildings
function buildHouse(g, lot, st, look, P, smoke, stats) {
  const w = lot.w, d = lot.d, n = st.storeys; const H = st.groundH + (n - 1) * st.storeyH; const gH = st.groundH;
  g.frame(lot.ox, lot.oy || 0, lot.oz, lot.rot); g.gy = lot.oy || 0; g.ao = look.bake; g.jit = look.jitter;
  const lr = rngOf(lot.id, st.era, 3); lot.lit = true;
  if (g.foot) g.foot.push([g.world([0, 0, 0]), g.world([w, 0, 0]), g.world([w, 0, -d]), g.world([0, 0, -d])]);
  const sideSkip = (lot.nl ? 'l' : '') + (lot.nr ? 'r' : '');
  if (look.detail >= 2) g.box(-0.02, 0, -d, w + 0.02, 0.13, 0.025, P.found, M.stone, 0, sideSkip);
  const jet = st.jetty ? 0.1 : 0;
  g.box(0, 0, -d, w, gH, 0, st.wallCol, wallMatOf(st.ground), 0, sideSkip);
  if (n > 1) g.box(0, gH, -d - (jet ? 0.05 : 0), w, H, jet, st.upperCol, wallMatOf(st.upper === 'timber' ? 'plaster' : st.upper));
  const Ff = { ox: 0, oz: 0, ux: 1, uz: 0, nx: 0, nz: 1 };
  const Fu = { ox: 0, oz: jet, ux: 1, uz: 0, nx: 0, nz: 1 };
  const Fb = { ox: w, oz: -d - (jet ? 0.05 : 0), ux: -1, uz: 0, nx: 0, nz: -1 };
  const Fl = { ox: 0, oz: -d, ux: 0, uz: 1, nx: -1, nz: 0 };
  const Fr = { ox: w, oz: 0, ux: 0, uz: -1, nx: 1, nz: 0 };
  const bays = Math.max(1, Math.round(w / st.bayW));
  const [ww, wh] = st.win; const wwF = Math.min(ww, (w / bays) * 0.62);
  const lit = () => lr.chance(0.55);
  const doorBay = Math.min(bays - 1, Math.floor(lot.doorBay * bays));
  // ground floor front
  if (st.shop) addShopfront(g, Ff, w, st, look, P, lit());
  else for (let b = 0; b < bays; b++) {
    const u = ((b + 0.5) * w) / bays;
    if (b === doorBay) { addDoor(g, Ff, u, st, look, P); continue; }
    addWindow(g, Ff, u, 0.24, wwF, Math.min(wh, gH - 0.38), st, look, lit(), { box: st.boxes && lr.chance(0.5) });
  }
  if (st.upper === 'timber' && n > 1 && look.detail >= 1) for (let s = 1; s < n; s++) addTimber(g, Fu, w, gH + (s - 1) * st.storeyH, gH + s * st.storeyH, st, P, bays, look);
  for (let s = 1; s < n; s++) {
    const v0 = gH + (s - 1) * st.storeyH;
    if (st.string && look.detail >= 2) g.fbox(Fu, 0, w, v0 - 0.035, v0 + 0.01, 0, 0.035, st.trim, M.stone);
    for (let b = 0; b < bays; b++) {
      const u = ((b + 0.5) * w) / bays;
      addWindow(g, Fu, u, v0 + 0.17, wwF, Math.min(wh, st.storeyH - 0.3), st, look, lit(), { box: st.boxes && s === 1 && lr.chance(0.6) });
    }
    if (st.balcony && s === 1 && n >= 3) {
      const u = w / 2, bw = Math.min(w * 0.4, 0.75);
      g.fbox(Fu, u - bw, u + bw, v0 + 0.08, v0 + 0.14, 0, 0.26, st.trim, M.stone);
      g.fbox(Fu, u - bw, u + bw, v0 + 0.36, v0 + 0.39, 0.22, 0.25, P.metal);
      if (!look.far) for (let k = 0; k <= 6; k++) { const uu = u - bw + (k / 6) * bw * 2; g.fbox(Fu, uu - 0.012, uu + 0.012, v0 + 0.14, v0 + 0.36, 0.225, 0.245, P.metal); }
    }
  }
  if (st.bay && n >= 2) {
    const u = w * (bays > 1 ? 0.5 / bays : 0.5), bw = 0.32, bh = gH + st.storeyH;
    g.fbox(Ff, u - bw, u + bw, 0.1, bh - 0.05, 0, 0.3, st.wallCol, wallMatOf(st.ground));
    addWindow(g, { ...Ff, oz: 0.3 }, u, 0.3, bw * 1.3, 0.45, st, look, lit(), { noShutters: true });
    addWindow(g, { ...Ff, oz: 0.3 }, u, gH + 0.17, bw * 1.3, 0.42, st, look, lit(), { noShutters: true });
    g.fbox(Ff, u - bw - 0.04, u + bw + 0.04, bh - 0.05, bh + 0.03, 0, 0.34, st.trim, M.stone);
  }
  if (st.cornice) {
    g.fbox(Fu, -0.02, w + 0.02, H - 0.11, H, 0, 0.07, st.trim, M.stone);
    if (look.ornament >= 2) g.fbox(Fu, -0.04, w + 0.04, H - 0.03, H + 0.03, 0, 0.12, st.trim, M.stone);
  }
  if (st.quoins && !look.far) for (const u of [0.0, w]) for (let y = 0.15; y < H - 0.2; y += 0.2) { const wq = ((y / 0.2) | 0) % 2 ? 0.16 : 0.1; const u0 = u === 0 ? 0 : w - wq; g.fbox(Fu, u0, u0 + wq, y, y + 0.17, 0, 0.02, st.trim, M.stone); }
  // back
  for (let s = 0; s < n; s++) {
    const v0 = s === 0 ? 0 : gH + (s - 1) * st.storeyH; const nb = Math.max(1, Math.round(w / 1.2));
    for (let b = 0; b < nb; b++) {
      const u = ((b + 0.5) * w) / nb;
      if (s === 0 && b === 0) { g.fquad(Fb, u - 0.16, 0.05, u + 0.16, 0.55, 0.012, st.door, M.timber); continue; }
      if (!look.far) g.fbox(Fb, u - wwF / 2 - 0.03, u + wwF / 2 + 0.03, v0 + 0.2, v0 + 0.2 + Math.min(wh, 0.42) + 0.06, 0, 0.015, st.frameCol);
      g.fquad(Fb, u - wwF / 2, v0 + 0.23, u + wwF / 2, v0 + 0.2 + Math.min(wh, 0.42) + 0.03, 0.017, st.glass, M.glass, lit() ? EMI.window : 0);
    }
  }
  // exposed sides
  for (const [flag, F] of [['l', Fl], ['r', Fr]]) {
    if (lot.exposed !== flag && !(lot.detached)) continue;
    const nb = Math.max(1, Math.round(d / st.bayW));
    for (let s = 0; s < n; s++) {
      const v0 = s === 0 ? 0.24 : gH + (s - 1) * st.storeyH + 0.17;
      for (let b = 0; b < nb; b++) addWindow(g, F, ((b + 0.5) * d) / nb, v0, Math.min(ww, (d / nb) * 0.6), Math.min(wh, (s === 0 ? gH - 0.38 : st.storeyH - 0.3)), st, look, lit(), {});
    }
    if (st.cornice) g.fbox(F, -0.02, d + 0.02, H - 0.11, H, 0, 0.07, st.trim, M.stone);
  }
  if (st.ivy) { const u = lr.chance(0.5) ? 0.05 : w - 0.6; const top = lr.range(0.8, H); for (let k = 0; k < 3; k++) g.fbox(Ff, u + k * 0.06, u + 0.55 - k * 0.1, 0.05, top - k * 0.25, 0.012 + k * 0.012, 0.04 + k * 0.012, mul(FLOWER, 0.8 + 0.1 * k), M.leaf); }
  if (st.turret) {
    const cx = lot.exposed === 'l' ? 0 : w, r = 0.42;
    const seg = look.far ? 6 : 10;
    g.cyl(cx, gH, 0, r, r, H + 0.25, seg, st.wallCol, wallMatOf(st.ground));
    g.cyl(cx, H + 0.25, 0, r + 0.06, 0, H + 1.25, seg, P.copper ? P.copper : st.roofCol, M.zinc, 0, false);
  }
  addRoof(g, w, d, H, st, look, P, smoke, lot);
  stats.buildings++;
  return H;
}

  lot.ox = c.x + lx * cr + lz * sr; lot.oz = c.z - lx * sr + lz * cr; lot.rot = c.rot; lot.oy = terrainH(c.x, c.z);

  g.poly([[w + 0.2, H - 0.2 * p, 0.15], [w / 2, R, 0.15], [w / 2, R, -d - 0.15], [w + 0.2, H - 0.2 * p, -d - 0.15]], st.roofCol, M.slate, 0, [w / 2, H, -d / 2]);
  g.poly([[0, H, -d], [w, H, -d], [w / 2, R, -d]], st.wallCol, M.stone, 0, [w / 2, H, -d / 2]);
  const Fl = { ox: 0, oz: -d, ux: 0, uz: 1, nx: -1, nz: 0 }, Fr = { ox: w, oz: 0, ux: 0, uz: -1, nx: 1, nz: 0 };

    if (look.detail >= 2) g.fbox(F, u - 0.42, u + 0.42 - 0.62, 0, H, 0, 0.18, st.wallCol, M.stone);
  }
  const tw = 2.3, tx = (w - tw) / 2, TH = 6.6;
  g.box(tx, 0, -1.3, tx + tw, TH, 1.0, st.wallCol, M.stone);
  const F = { ox: tx, oz: 1.0, ux: 1, uz: 0, nx: 0, nz: 1 };
  g.fquad(F, tw / 2 - 0.32, 0.05, tw / 2 + 0.32, 1.15, 0.02, lin(0x5a3b2a), M.timber);

  if (look.detail >= 2) g.box(tx - 0.08, TH - 0.15, -1.38, tx + tw + 0.08, TH, 1.08, st.trim, M.stone);
  g.cyl(tx + tw / 2, TH, -0.15, tw * 0.74, 0, TH + 5.2, 8, st.roofCol, M.slate, 0, false, Math.PI / 8);
  g.beam([tx + tw / 2, TH + 5.1, -0.15], [tx + tw / 2, TH + 5.7, -0.15], 0.05, 0.05, lin(0xc9a34a), M.plain, [1, 0, 0]);
  stats.buildings++;

function buildTownHall(g, look, P, E, stats) {
  const st = styleFor(99, 1, look, P, {}); st.wallCol = P.stone[1]; st.ground = 'stone'; st.upper = 'stone'; st.upperCol = st.wallCol; st.roofCol = P.slate[1]; st.roofMat = 'slate'; st.cornice = true; st.string = look.detail >= 2; st.shutters = false;

// ---------------------------------------------------------------- pattern textures, made in code at load
// One 256 x 256 layer per material: R is a brightness multiplier (0.5 means x1), G a mask (mortar, stripes, flowers),

// ---------------------------------------------------------------- baked ground occlusion
// Footprints and tree crowns are drawn into a world-space mask, blurred twice (contact and enclosure) and sampled by
// every ground-level surface. It replaces screen-space ambient occlusion for the price of one texture fetch.
function makeAoTexture(footprints, trees) {
  const R = 128, PX = 2.5, N = Math.round(2 * R * PX); const occ = new Float32Array(N * N);
  for (const f of footprints) {
    const pts = f.map((p) => [(p[0] + R) * PX, (p[2] + R) * PX]);
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const q of pts) { x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); }
    for (let y = Math.max(0, Math.floor(y0)); y <= Math.min(N - 1, Math.ceil(y1)); y++) for (let x = Math.max(0, Math.floor(x0)); x <= Math.min(N - 1, Math.ceil(x1)); x++) {
      const px = x + 0.5, py = y + 0.5; let pos = 0, neg = 0;
      for (let k = 0; k < 4; k++) { const a = pts[k], b = pts[(k + 1) % 4]; const cr = (b[0] - a[0]) * (py - a[1]) - (b[1] - a[1]) * (px - a[0]); if (cr > 0) pos++; else if (cr < 0) neg++; }
      if (pos === 0 || neg === 0) occ[y * N + x] = 1;
    }
  }
  for (const t of trees) {
    const cx = (t.x + R) * PX, cy = (t.z + R) * PX, r = 0.9 * (t.s || 1) * PX; if (cx < 0 || cy < 0 || cx >= N || cy >= N) continue;
    for (let y = Math.max(0, Math.floor(cy - r)); y <= Math.min(N - 1, Math.ceil(cy + r)); y++) for (let x = Math.max(0, Math.floor(cx - r)); x <= Math.min(N - 1, Math.ceil(cx + r)); x++) {
      const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy) / r; if (d < 1) occ[y * N + x] = Math.max(occ[y * N + x], 0.5 * (1 - d * d));
    }
  }
  const blur = (src, r) => {
    const tmp = new Float32Array(N * N), out = new Float32Array(N * N), w = 2 * r + 1;
    for (let y = 0; y < N; y++) { let acc = 0; for (let x = -r; x <= r; x++) acc += src[y * N + clamp(x, 0, N - 1)]; for (let x = 0; x < N; x++) { tmp[y * N + x] = acc / w; acc += src[y * N + Math.min(N - 1, x + r + 1)] - src[y * N + Math.max(0, x - r)]; } }
    for (let x = 0; x < N; x++) { let acc = 0; for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, N - 1) * N + x]; for (let y = 0; y < N; y++) { out[y * N + x] = acc / w; acc += tmp[Math.min(N - 1, y + r + 1) * N + x] - tmp[Math.max(0, y - r) * N + x]; } }
    return out;
  };
  const near = blur(blur(occ, 2), 2), wide = blur(blur(occ, 8), 8);
  const data = new Uint8Array(N * N);
  for (let i = 0; i < N * N; i++) data[i] = Math.round(255 * clamp(1 - near[i] * 0.5 - wide[i] * 0.2, 0.35, 1));
  const tex = new THREE.DataTexture(data, N, N, THREE.RedFormat, THREE.UnsignedByteType);
  tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter; tex.needsUpdate = true;
  return { tex, rect: new THREE.Vector4(-R, -R, 1 / (2 * R), 1 / (2 * R)) };
}

// Each chunk shows its near version only within the preset's distance, with a little hysteresis.

let skyTex = null;

const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpS = new THREE.Vector3(), tmpP = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);
const ZERO = new THREE.Matrix4().makeScale(0, 0, 0);
function animate(t) {

  for (const s of built.smoke) for (let j = 0; j < 3; j++) { const ph = (t * 0.22 + j / 3 + ((s[0] * 0.37) % 1) + 1) % 1; const sc = 0.09 + ph * 0.2; tmpM.makeScale(sc, sc, sc); tmpM.setPosition(s[0] + ph * 0.45, s[1] + ph * 1.1, s[2] + ph * 0.2); sm.setMatrixAt(k++, tmpM); }

  for (const s of built.bigSmoke) for (let j = 0; j < 7; j++) { const ph = (t * 0.12 + j / 7) % 1; const sc = 0.4 + ph * 1.3; tmpM.makeScale(sc, sc * 0.85, sc); tmpM.setPosition(s[0] + ph * 4.0, s[1] + ph * 3.5, s[2] + ph * 1.2); bs.setMatrixAt(k++, tmpM); }

// ---------------------------------------------------------------- fog and tilt follow the camera
function updateCameraDeps() {
  const look = LOOKS[state.look]; const d = camera.position.distanceTo(controls.target);
  if (look.haze <= 0.01) { scene.fog.near = d * 1.5; scene.fog.far = d * 6.0; }
  else { scene.fog.near = d * (1.15 - look.haze * 0.55); scene.fog.far = d * (5.2 - look.haze * 2.6); }
  finalMat.uniforms.amount.value = look.tilt * (0.25 + 0.75 * clamp((d - 18) / 60, 0, 1));
}

// ---------------------------------------------------------------- UI
const $ = (id) => document.getElementById(id);
function renderNote() {
  const t = TEXT[state.look];
  $('note').innerHTML = `
    <div class="eyebrow">${state.look === 'today' ? 'Reference' : 'Option'}${t.pick ? '<span class="pick">Picked</span>' : ''}</div>
    <h2>${t.name}</h2>
    <p class="tag">${t.tag}</p>
    <ul>${t.bullets.map((b) => `<li>${b}</li>`).join('')}</ul>
    <dl><dt>Cost</dt><dd>${t.cost}</dd><dt>Feels</dt><dd>${t.feel}</dd></dl>
    ${state.look === 'today' ? '' : `<div class="era">${ERATEXT[state.era]}${state.layered && state.era !== 'old' ? ' Older buildings keep the era they were built in.' : ''}</div>`}`;
}
function syncButtons() {

  const today = state.look === 'today';

  $('caption').hidden = !today; if (today) $('caption').textContent = 'Today: Thistlecombe, a Village of 60 (docs/build/screenshots/c4e-village-town.png)';
  for (const id of ['era-old', 'era-steam', 'era-bright', 'time-day', 'time-golden', 'time-night', 'view-town', 'view-street', 'view-grand', 'layered']) $(id).disabled = today;
}
function writeHash() {
  const h = `${state.look}-${state.era}-${state.time}-${state.view}${state.layered ? '' : '-allera'}-${quality}`;
  try { history.replaceState(null, '', '#' + h); } catch (e) { /* hash routing is optional */ }
